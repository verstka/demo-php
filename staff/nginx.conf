# Example nginx front for Verstka CMS demo (PHP + php-fpm).
# Adjust paths, server_name, TLS, and php-fpm socket.

# ~10 POST /cms/login per IP: burst of 10, then ~1 per minute (nginx has no 30-min window).
limit_req_zone $binary_remote_addr zone=cms_login_ip:10m rate=1r/m;

server {
    listen 80;
    server_name example.com;

    set $demo_public /var/www/demo-cms/public;
    # Match staff/php-fpm-pool.conf.example listen socket (adjust PHP version)
    set $php_fpm unix:/run/php/php8.3-fpm-demo-cms.sock;

    client_max_body_size 20m;

    location = /cms/login {
        limit_req zone=cms_login_ip burst=9 nodelay;
        limit_req_status 429;

        include fastcgi_params;
        fastcgi_pass $php_fpm;
        fastcgi_param SCRIPT_FILENAME $demo_public/index.php;
        fastcgi_param DOCUMENT_ROOT $demo_public;
        fastcgi_read_timeout 120s;
    }

    # Slim: CMS and Verstka callbacks → public/index.php
    location ^~ /cms {
        include fastcgi_params;
        fastcgi_pass $php_fpm;
        fastcgi_param SCRIPT_FILENAME $demo_public/index.php;
        fastcgi_param DOCUMENT_ROOT $demo_public;
        fastcgi_read_timeout 120s;
    }

    location ^~ /verstka/ {
        include fastcgi_params;
        fastcgi_pass $php_fpm;
        fastcgi_param SCRIPT_FILENAME $demo_public/index.php;
        fastcgi_param DOCUMENT_ROOT $demo_public;
        fastcgi_read_timeout 120s;
    }

    # Static site root = SQLite / Verstka output tree (same as app storage_dir)
    root /var/www/demo-cms/storage;

    location = / {
        return 302 /index/;
    }

    location = /sitemap.xml {
        alias /var/www/demo-cms/storage/sitemap.xml;
    }

    location = /favicon.ico {
        alias /var/www/demo-cms/storage/favicon.ico;
    }

    location / {
        try_files $uri $uri/index.html =404;
    }
}
